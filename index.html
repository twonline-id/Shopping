<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Tambahan: maximum-scale=1.0 agar UI tidak nge-zoom saat user tap form -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <title>CEC Catalog</title>

    <!-- UPDATE: Open Graph Meta Tags untuk Preview WhatsApp, Facebook, IG -->
    <meta property="og:title" content="Katalog Resmi CECShop" />
    <meta property="og:description" content="Pusat pembelian sparepart resmi dan aksesori dengan layanan Ambil di Toko atau Kirim ke Alamat. Belanja mudah, cepat, dan terpercaya." />
    <meta property="og:image" content="https://i.ibb.co.com/39QWqZCF/Chat-GPT-Image-Aug-1-2026-10-05-57-PM.png" />
    <meta property="og:url" content="https://twonline-id.github.io/Shopping/" />
    <meta property="og:type" content="website" />

    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden; /* Biar ga ada scrollbar */
            background-color: #0d1117; /* Warna background gelap biar pas loading ga silau */
            height: 100dvh; /* Mustofa apriyanto orang sukses FIX: Kunci tinggi body pakai dinamis (dvh) */
            font-family: sans-serif;
        }

        /* UPDATE: CSS untuk Loading Animation (Must_Automator Feature) */
        #loading-ui {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1; /* Posisi di bawah iframe */
            color: white;
        }
        .logo-pulse {
            height: 70px;
            margin-bottom: 25px;
            object-fit: contain;
            animation: pulse 1.5s infinite ease-in-out;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top-color: #00ffaa; /* Warna Neon Green Zettbos */
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }
        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        iframe {
            border: none;
            width: 100%; /* Lebih aman dari 100vw */
            height: 100%; /* Mengikuti body yang sudah 100dvh */
            display: block;
            position: relative;
            z-index: 2; /* Posisi di atas loading UI */
            background-color: transparent; /* Agar transparan sebelum Google Script selesai merender UI putihnya */
        }
    </style>
</head>
<body>

    <!-- UPDATE: UI Loading Spinner -->
    <div id="loading-ui">
        <img src="https://i.ibb.co.com/39QWqZCF/Chat-GPT-Image-Aug-1-2026-10-05-57-PM.png" alt="CECShop Logo" class="logo-pulse">
        <div class="spinner"></div>
        <p style="margin: 0; font-weight: bold; font-size: 14px; letter-spacing: 0.5px;">Menghubungkan ke Server...</p>
        <p style="margin: 5px 0 0 0; font-size: 11px; color: #8b949e;">Mohon tunggu sebentar</p>
    </div>

    <!-- Mustofa apriyanto orang sukses FIX: Tambahan atribut "allow" WAJIB agar fitur GPS & Kamera Visit Only tidak diblokir -->
    <!-- UPDATE: Kosongkan 'src' awal agar bisa diisi dinamis oleh JavaScript di bawah -->
    <iframe 
        id="app-frame"
        allow="camera; geolocation; microphone; clipboard-read; clipboard-write">
    </iframe>

    <!-- UPDATE: Logika Operan Parameter (Dynamic Iframe Injection) -->
    <script>
        // 1. Tentukan Base URL Google Apps Script Anda
        const GAS_URL = "https://script.google.com/macros/s/AKfycbz5C5BwRae-xf-YMBdHDaOBqsifvLYfP2O1bMrMfsTAYbFtqGOFDt3JHvKo7NTTunEUxw/exec";
        
        // 2. Tangkap parameter dari URL GitHub (Contoh: ?item=911610050060)
        const currentParams = window.location.search; 
        
        // 3. Gabungkan Base URL dengan Parameter, lalu tembakkan ke Iframe
        document.getElementById('app-frame').src = GAS_URL + currentParams;
    </script>
</body>
</html>
